# Description:
#   - Close a milestone by title or number.

name: Milestone Close@local
on:
  workflow_dispatch:
    inputs:
      milestone:
        required: true
        description: 'Title / Number'

# Fix GraphQL: Resource not accessible by integration (updatePullRequest)
permissions:
  contents: read
  pull-requests: write

jobs:
  close-milestone:
    runs-on: ubuntu-latest
    name: Close Milestone
    steps:
      # Required by `uses: ./`: a dispatched run should exercise the branch it was
      # dispatched from, not whatever `@develop` happened to point at.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Close Milestone
        id: close
        uses: ./
        with:
          action: close
          milestone: ${{ github.event.inputs.milestone }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Milestone Number
        if: success()
        shell: nu {0}
        run: |
          print $"The closed milestone number is (ansi p)${{ steps.close.outputs.milestone-number }}(ansi reset)"
