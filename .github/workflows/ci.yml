# Description:
#   - Create, Close and Delete a milestone.

name: Milestone Operations@local
on:
  pull_request:
  workflow_dispatch:

# Fix GraphQL: Resource not accessible by integration (updatePullRequest)
permissions:
  pull-requests: write

jobs:
  milestone:
    runs-on: ubuntu-latest
    name: Milestone Operates
    steps:
      # Required by `uses: ./`, so that CI exercises the code under review
      # instead of the published action from a remote branch.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create Milestone
        id: create
        uses: ./
        with:
          action: create
          title: 'v0.0.1'
          due-on: '2025/12/31'
          description: 'Test Create Milestone'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Close Milestone
        id: close
        uses: ./
        with:
          action: close
          milestone: 'v0.0.1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Delete Milestone
        id: delete
        uses: ./
        with:
          action: delete
          milestone: ${{ steps.create.outputs.milestone-number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
